version: '3.8'

services:
  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - app-logs:/var/log/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  log-watcher:
    build: ./log-watcher
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - app-logs:/var/log/app:ro
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

volumes:
  app-logs:
